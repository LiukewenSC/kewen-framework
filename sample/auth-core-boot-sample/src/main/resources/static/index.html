function range(a,b){const o=[];for(let i=a;i<b;i++)o.push(i);return o}
function ids(r){const d=r&&r.data;if(!Array.isArray(d))return '';return d.map(x=>x.id!==undefined?x.id:x.assetId).sort((a,b)=>a-b).join(',')}

const BASE = location.pathname.replace(/\/(index\.html)?$/,'');
let running = false;

async function call(method, path, body, demoUser, traceId) {
  const h = {'Content-Type':'application/json; charset=utf-8'};
  if (demoUser) h['X-Demo-User'] = demoUser;
  if (traceId) h['X-Trace-Id'] = traceId;
  const resp = await fetch(BASE + path, {method, headers:h, body: method==='POST' ? JSON.stringify(body||{}) : undefined});
  let json;
  try { json = await resp.json(); }
  catch (e) { json = {code: null, message: '非 JSON 响应（服务端抛异常）', data: null, __nonJson: true}; }
  json.__http = resp.status;
  return json;
}

async function traceOf(traceId) {
  const r = await call('GET', '/demo/trace?traceId=' + encodeURIComponent(traceId), null, null, null);
  return JSON.stringify(r.data || []);
}
async function logOf(key) {
  const r = await call('GET', '/demo/log?apiKey=' + encodeURIComponent(key), null, null, null);
  return (r.data || {}).count;
}

async function run(s) {
  const demoUser = s.demoUser !== undefined ? s.demoUser : document.getElementById('demoUser').value;
  const traceId = 'ui-' + s.id + '-' + Date.now();
  let before = null;
  if (s.log) before = await logOf(s.log);
  const steps = s.steps || [s];
  let last = null;
  for (const st of steps) last = await call(st.m, st.p, st.b, demoUser, traceId);
  const trace = await traceOf(traceId);
  let after = null, delta = null;
  if (s.log) { after = await logOf(s.log); delta = after - before; }
  let extra = '';
  if (s.then) extra = JSON.stringify((await call('GET', s.then, null, demoUser, null)).data || {});
  let pass = false, why = '';
  const logInfo = {delta: delta, before: before, after: after};
  try { pass = !!s.ck(last, trace, extra, logInfo); } catch (e) { why = '断言异常 ' + e; }
  if (!pass && !why) why = '业务 code=' + last.code + '，行集=' + ids(last) + (s.log ? '，副作用Δ=' + delta : '');
  // 拒绝在本项目里一律是 HTTP 200 + 业务 code 403/400（Result.failed 的形态），
  // 两个值必须分开显示，否则 "HTTP 200" 会被误读成"这次放行了"
  // Spring 自己的错误体没有 code 字段（只有 status），不能印成 undefined
  const bodyCode = (last.code === undefined || last.code === null) ? null : last.code;
  return {pass: pass, detail: why, http: last.__http, bodyCode: bodyCode, springStatus: last.status || null,
          message: last.message, dataBrief: brief(last), trace: trace,
          logDelta: delta, steps: steps.length, expect: s.ex};
}

/**
 * 取出本次请求里包含某关键字的语句原文。
 * "未被声明的语句不该出现权限子查询"这类断言必须按语句逐条判，
 * 不能在整个 trace 文本上做 include/not include——那样别的语句里的内容会被算进来
 *
 * @param traceJson trace 接口返回的 JSON 文本
 * @param keyword   定位用的关键字
 * @return 命中的语句列表
 */
function sqlOf(traceJson, keyword) {
  let arr = [];
  try { arr = JSON.parse(traceJson) || []; } catch (e) { return []; }
  return arr.filter(e => e.type === 'sql' && String(e.sql).indexOf(keyword) >= 0).map(e => String(e.sql));
}

/** 把响应数据摘要成一行，便于核对行集 */
function brief(r) {
  const d = r.data;
  if (Array.isArray(d)) return '[' + d.map(x => x.id !== undefined ? x.id : x.assetId).join(',') + ']';
  if (d && typeof d === 'object') return JSON.stringify(d).slice(0, 120);
  return (d === undefined || d === null) ? '—' : String(d);
}

function render(s, res) {
  const row = document.getElementById('row-' + s.id);
  const cell = row.querySelector('.res');
  const ev = row.querySelector('.ev');
  cell.innerHTML = res === null ? '<span class="tag todo">待运行</span>'
    : res.pass ? '<span class="tag pass">通过</span>'
    : '<span class="tag fail">不通过</span>';
  if (res === null) { ev.innerHTML = '<span class="kv">—</span>'; return; }
  const head = '期望 ' + esc(res.expect)
    + '<br>HTTP ' + res.http + ' · 业务 code <b>' + (res.bodyCode === null ? ('—（Spring 错误体 status=' + res.springStatus + '）') : res.bodyCode) + '</b>'
    + (res.steps > 1 ? '（末次请求，共 ' + res.steps + ' 步）' : '')
    + (res.dataBrief && res.dataBrief !== '—' ? '<br>返回 ' + esc(res.dataBrief) : '')
    + (res.message ? '<br>消息 ' + esc(res.message) : '')
    + (res.logDelta !== null && res.logDelta !== undefined ? '<br>副作用 Δ=' + res.logDelta : '');
  const tail = res.pass ? '' : '<br><span style="color:#b3261e">判定未达成：' + esc(res.detail) + '</span>';
  ev.innerHTML = '<span class="kv">' + head + tail + '</span>'
      + (res.trace && res.trace.length > 4 ? '<pre>' + esc(prettifyTrace(res.trace)) + '</pre>' : '');
}
function esc(t){return String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function prettifyTrace(j){
  try { const arr = JSON.parse(j); return arr.map(e => e.type==='judge' ? ('判定 ' + e.source + '/' + e.action + ' idCount=' + e.idCount)
    : ('[' + e.source + '] ' + String(e.sql).replace(/\s+/g,' '))).join('\n'); } catch(e) { return j; }
}

function build() {
  const tb = document.getElementById('tbody');
  tb.innerHTML = '';
  const shown = document.querySelectorAll('.flt:checked');
  const on = new Set(Array.from(shown).map(x=>x.dataset.g));
  S.filter(s=>on.has(s.g)).forEach(s => {
    const tr = document.createElement('tr');
    tr.id = 'row-' + s.id;
    tr.innerHTML = '<td class="id">' + s.id + '</td>'
      + '<td>' + esc(s.name) + '<div class="kv">' + (s.demoUser!==undefined?('身份：'+(s.demoUser||'无')):'身份：跟随下拉框') + (s.log?('　证据表：'+s.log):'') + '</div></td>'
      + '<td>' + esc(s.ex) + '</td>'
      + '<td class="res"><span class="tag todo">待运行</span></td>'
      + '<td class="ev"><span class="kv">—</span></td>'
      + '<td><button data-id="' + s.id + '">运行</button></td>';
    tb.appendChild(tr);
  });
  tb.querySelectorAll('button').forEach(b => b.onclick = async () => {
    const s = S.find(x => x.id === b.dataset.id);
    b.disabled = true;
    render(s, null);
    const res = await run(s);
    render(s, res);
    b.disabled = false;
  });
}

document.getElementById('runAll').onclick = async () => {
  if (running) return;
  running = true; document.getElementById('runAll').disabled = true;
  build();
  let p = 0, f = 0;
  const visible = Array.from(document.querySelectorAll('#tbody tr')).map(tr => S.find(s => s.id === tr.id.slice(4)));
  for (const s of visible) {
    const res = await run(s);
    render(s, res);
    if (res.pass) p++; else f++;
  }
  document.getElementById('summary').textContent = '一次跑完：通过 ' + p + '，不通过 ' + f + '（' + new Date().toLocaleTimeString() + '）';
  running = false; document.getElementById('runAll').disabled = false;
};

document.getElementById('whoami').onclick = async () => {
  const u = document.getElementById('demoUser').value;
  const r = await call('GET', '/demo/current-user', null, u, null);
  document.getElementById('pUser').textContent = u ? JSON.stringify(r.data, null, 1) : '（未提供身份）' + JSON.stringify(r.data, null, 1);
};
document.getElementById('counts').onclick = async () => {
  const r = await call('GET', '/demo/counts', null, null, null);
  document.getElementById('pCounts').textContent = (r.data||[]).map(x => x.tableName + ' = ' + x.rowCount).join('\n');
};
document.getElementById('menuApi').onclick = async () => {
  const r = await call('GET', '/demo/menu-api', null, null, null);
  document.getElementById('pMenu').textContent = (r.data||[]).map(x => (x.parentId && x.parentId !== 0 ? '  └ ' : '') + x.path + '  「' + x.name + '」' + (x.remark?(' 备注='+x.remark):'')).join('\n');
};
document.getElementById('call').onclick = async () => {
  const m = document.getElementById('m').value, p = document.getElementById('path').value, b = document.getElementById('body').value;
  const tid = 'ui-manual-' + Date.now();
  const r = await call(m, p, b ? JSON.parse(b) : {}, document.getElementById('demoUser').value, tid);
  const t = await traceOf(tid);
  document.getElementById('pCall').textContent = 'HTTP ' + r.__http + '\n' + JSON.stringify(r, null, 1) + '\n\n本次下发的语句：\n' + prettifyTrace(t);
};
Array.from(document.querySelectorAll('.flt')).forEach(c => c.onchange = build);
build();
document.getElementById('demoUser').value = 'alice';
document.getElementById('whoami').click();
document.getElementById('counts').click();
</script>
</body>
</html>
