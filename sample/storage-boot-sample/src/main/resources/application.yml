spring:
  application:
    name: sample
  # demo 默认用 H2 内存库，本机没有 MySQL 也能起；换本地 MySQL 用 --spring.profiles.active=mysql
  profiles:
    active: h2

cu:
  storage:
    type: qiniu
    access-key: your_qiniu_access_key
    secret-key: your_qiniu_secret_key
    bucket: your_bucket_name
    is-public: false
    download-domain: your_download_domain
    upload-callback-url: https://your_domain.com/storage/upload/callback

---
# H2 内存数据源（MySQL 兼容模式）。H2 相关的一切只写在本段内。
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:storage_sample;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # 建表脚本只有 docs/sql 一份，由 sample/pom.xml 的 <resources> 挂到 classpath:sql/ 下
  # （basic-support.sql 含 file_detail / file_part_detail / sys_storage_file）。
  # encoding 必须显式指定，脚本里有中文注释，否则跟随平台默认编码。
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:sql/basic-support.sql
  # H2 Web 控制台：http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

---
# 本地 MySQL 数据源（沿用 p6spy 驱动，jdbc:p6spy 前缀不能少，否则 P6SpyDriver 不认）
# 本 profile 不执行任何建表脚本：file_detail / file_part_detail / sys_storage_file
# 请自行执行 docs/sql/basic-support.sql 建好后再启动。
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:p6spy:mysql://localhost:3306/your_database
    username: your_username
    password: your_password
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
