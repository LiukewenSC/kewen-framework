server:
  port: 8080

spring:
  application:
    name: sample
  # demo 默认用 H2 内存库，本机没有 MySQL 也能起；换本地 MySQL 用 --spring.profiles.active=mysql
  profiles:
    active: h2

cu:
  notify:
    fang-tang:
      enabled: true
      key: your_fangtang_key
      domain: https://sctapi.ftqq.com
  request:
    message:
      fang-tang: true
    persistent:
      database: true

---
# H2 内存数据源（MySQL 兼容模式）。H2 相关的一切只写在本段内。
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:sample;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      auto-commit: true
      connection-test-query: select 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 5
      minimum-idle: 2
      validation-timeout: 5000
      pool-name: HikariCP-H2
  # 建表脚本只有 docs/sql 一份，由 sample/pom.xml 的 <resources> 挂到 classpath:sql/ 下。
  # encoding 必须显式指定，脚本里有中文注释，否则跟随平台默认编码。
  # mode 只写在本段：内存库每次启动都是空库，可以放心 always 重建。
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:sql/basic-support.sql
  # H2 Web 控制台：http://localhost:8080/h2-console （JDBC URL 填上方 datasource.url）
  h2:
    console:
      enabled: true
      path: /h2-console

---
# 本地 MySQL 数据源（沿用 p6spy 驱动，jdbc:p6spy 前缀不能少，否则 P6SpyDriver 不认）
# 本 profile 不执行任何建表脚本：cu.request.persistent.database 需要的 sys_request_log 等表，
# 请自行执行 docs/sql/basic-support.sql 建好后再启动。
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:p6spy:mysql://localhost:3306/your_database
    username: your_username
    password: your_password
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    hikari:
      auto-commit: true
      connection-test-query: select 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      minimum-idle: 2
      validation-timeout: 5000
      pool-name: HikariCP-Pool-1
